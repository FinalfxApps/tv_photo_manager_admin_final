name: FINAL FX Flutter Web CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze active Dart entry points
        shell: bash
        run: |
          set +e
          flutter analyze lib/main.dart lib/fx_master_restaurant_studio.dart 2>&1 | tee "$RUNNER_TEMP/flutter-analyze.log"
          analyze_status=${PIPESTATUS[0]}
          set -e
          if grep -E 'error[[:space:]]*[•-]|: Error:|Error when compiling|Could not compile' "$RUNNER_TEMP/flutter-analyze.log" >/dev/null; then
            echo "Dart analyzer reported errors."
            exit 1
          fi
          if [ "$analyze_status" -ne 0 ]; then
            echo "Analyzer returned $analyze_status due to non-error lints; the release build is the required compiler gate."
          fi

      - name: Build release web app
        run: flutter build web --release

      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-fx-tv-web-${{ github.sha }}
          path: build/web/
          if-no-files-found: error
          retention-days: 14
